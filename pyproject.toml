[project]
name = "tieba-autosign"
version = "0.1.0"
description = "private personal utility"
readme = "README.md"
authors = [
    { name = "Lynricsy", email = "im@ling.plus" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]
keywords = []
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
tieba-autosign = "tieba_autosign.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
